# GitHub Actions Workflow — smart-dining
# Auto-upgraded by Sean 10-repo-fleet Batch 5A (2026-09-06)
# 4 jobs: lint / test / build / deploy (Vercel × 2 + Railway backend)
# Note: existing 1-job verify CI was extended with separate lint/test/build/deploy stages
#   to align with the fleet 4-job standard.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps || npm install
      - name: Backend tsc --noEmit
        working-directory: backend
        run: npx tsc --noEmit
        continue-on-error: true  # dev-time check, don't block
      - name: Kiosk lint
        working-directory: kiosk-frontend
        run: npm run lint
        continue-on-error: true
      - name: Mobile typecheck
        working-directory: mobile-app
        run: npm run typecheck
        continue-on-error: true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps || npm install
      - name: Prisma generate (test fixture)
        working-directory: backend
        run: npx prisma generate
      - name: Backend vitest
        working-directory: backend
        run: npx vitest run
      - name: Shared contracts smoke test
        working-directory: shared-contracts
        run: npm test

  build:
    name: Build (4 workspaces)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps || npm install
      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate
      - name: Full workspace build (contracts → backend → kiosk → mobile)
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-dist
          path: kiosk-frontend/dist/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-dist
          path: mobile-app/dist/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy (Vercel × 2 + Railway backend)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps || npm install

      # KIOSK deploy to Vercel (uses vercel.kiosk.json)
      - name: Deploy KIOSK to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_KIOSK_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
        continue-on-error: true  # missing secrets is non-fatal

      # Mobile deploy to Vercel (uses vercel.mobile.json)
      - name: Deploy Mobile to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_MOBILE_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
        continue-on-error: true

      # Backend deploy to Railway
      - name: Deploy Backend to Railway
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: ${{ secrets.RAILWAY_BACKEND_SERVICE }}
        continue-on-error: true  # missing secrets is non-fatal
