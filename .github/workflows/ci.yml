# GitHub Actions Workflow — smart-dining
#
# lint / test / build / e2e 任一步驟失敗即整個 job 失敗（AC-001：不使用 continue-on-error）。
# deploy 只在 main push 時執行；缺 secrets 時不擋錯（部署不在 M1 範圍）。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Typecheck (workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate
      - name: Backend tsc --noEmit
        working-directory: backend
        run: npx tsc --noEmit
      - name: Build shared contracts (frontends typecheck against its dist types)
        run: npm run build -w @smart-dining/contracts
      - name: Kiosk lint
        working-directory: kiosk-frontend
        run: npm run lint
      - name: Mobile typecheck
        working-directory: mobile-app
        run: npm run typecheck

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate
      - name: All workspace tests (contracts / backend vitest / kiosk vitest)
        run: npm test

  build:
    name: Build (4 workspaces)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate
      - name: Full workspace build (contracts → backend → kiosk → mobile)
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-dist
          path: kiosk-frontend/dist/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-dist
          path: mobile-app/dist/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: E2E (API smoke + WebSocket)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate
      - name: API smoke test (fails on any unexpected status, incl. 404/500)
        working-directory: backend
        run: npm run test:api
      - name: API + WebSocket end-to-end script
        working-directory: backend
        run: npm run test:e2e

  deploy:
    name: Deploy (Vercel × 2 + Railway backend)
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      # KIOSK deploy to Vercel (uses vercel.kiosk.json)
      - name: Deploy KIOSK to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_KIOSK_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
        continue-on-error: true  # missing secrets is non-fatal

      # Mobile deploy to Vercel (uses vercel.mobile.json)
      - name: Deploy Mobile to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_MOBILE_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
        continue-on-error: true

      # Backend deploy to Railway
      - name: Deploy Backend to Railway
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: ${{ secrets.RAILWAY_BACKEND_SERVICE }}
        continue-on-error: true  # missing secrets is non-fatal
